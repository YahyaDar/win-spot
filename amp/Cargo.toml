[package]
name = "spoterm-amp"
version = "0.1.0"
edition = "2021"
description = "SpoTermAmp: a classic Winamp-skinned window for SpoTerm's engine (Win32 + GDI, no framework)"
license = "MIT"
publish = false

[[bin]]
name = "SpoTermAmp"
path = "src/main.rs"

[dependencies]
serde_json = "1"
miniz_oxide = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
